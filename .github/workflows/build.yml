# Kiểm tra build trên mỗi PR và mỗi lần push lên main. Deploy do Vercel tự làm qua Git integration.
# Build không cần .env: thiếu biến Supabase thì app chỉ hiện màn hình hướng dẫn.
name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
