# Supabase gói Free tạm dừng project sau 7 ngày không hoạt động → gọi API định kỳ để giữ project chạy.
# Cần 2 secret trong GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY (giống VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY trong .env)
name: Giữ Supabase hoạt động

on:
  schedule:
    - cron: '0 2 */3 * *' # 02:00 UTC mỗi 3 ngày
  workflow_dispatch: # Cho phép chạy tay trong tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Truy vấn thật vào database (RLS trả về rỗng với anon, nhưng vẫn tính là hoạt động)
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/places?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
