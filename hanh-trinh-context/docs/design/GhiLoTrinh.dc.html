<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ghi lộ trình</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a:hover{opacity:.85}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{t.card}}; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: {{t.ink}}">

<div style="position: absolute; top: 0; left: 0; width: 390px; height: 420px; background: {{t.sky}}"></div>
<svg width="390" height="420" viewBox="0 0 390 420" style="position: absolute; top: 0; left: 0; opacity: 0.28; mix-blend-mode: overlay" aria-hidden="true">
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<rect width="390" height="420" filter="url(#grain)"></rect>
</svg>

<svg width="390" height="420" viewBox="0 0 390 420" style="position: absolute; top: 0; left: 0" aria-hidden="true">
<path d="M60 360 C 100 320, 90 270, 140 250 S 220 250, 240 200 S 300 150, 318 118" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.95"></path>
<circle cx="60" cy="360" r="6" fill="#FFFFFF"></circle>
<circle cx="318" cy="118" r="18" fill="#FFFFFF" opacity="0.3"></circle>
<circle cx="318" cy="118" r="8" fill="#FFFFFF"></circle>
</svg>

<div style="position: absolute; top: 16px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center">
<a href="Main.dc.html" aria-label="Thu nhỏ, vẫn tiếp tục ghi" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255, 255, 255, 0.22); display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</a>
<span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.22); color: #FFFFFF; font: 500 12px 'JetBrains Mono', monospace; letter-spacing: 0.06em">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #FFFFFF"></span>
ĐANG GHI, GPS ±6 m
</span>
</div>

<section style="position: absolute; top: 388px; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 24px 24px 28px; background: {{t.card}}; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font: 500 11px 'JetBrains Mono', monospace; letter-spacing: 0.16em; color: {{t.muted}}">ĐI BỘ BUỔI CHIỀU</span>
<span style="font: 500 11px 'JetBrains Mono', monospace; color: {{t.muted}}">24.09.2026</span>
</div>

<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font: 400 76px/0.9 'Playfair Display', serif; letter-spacing: -0.03em">3,42</span>
<span style="font-size: 20px; color: {{t.muted}}">km</span>
</div>

<dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div>
<dt style="font: 500 11px 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: {{t.muted}}">THỜI GIAN</dt>
<dd style="margin: 4px 0 0; font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums">42:18</dd>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div>
<dt style="font: 500 11px 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: {{t.muted}}">TỐC ĐỘ TB</dt>
<dd style="margin: 4px 0 0; font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums">12'22"<span style="font-size: 13px; color: {{t.muted}}">/km</span></dd>
</div>
<span aria-hidden="true" style="position: relative; width: 6px; height: 40px; border-radius: 3px; background: linear-gradient(180deg, #FF4D8D, #FFB24A 55%, #7B61FF)"><span style="position: absolute; left: -4px; top: 14px; width: 14px; height: 2px; background: {{t.ink}}"></span></span>
</div>
</dl>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between">
<span style="font: 500 11px 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: {{t.muted}}">MỤC TIÊU HÔM NAY</span>
<span style="font: 500 11px 'JetBrains Mono', monospace; color: {{t.muted}}">5 km</span>
</div>
<div style="position: relative; height: 44px; border-radius: 14px; background: {{t.track}}; overflow: hidden">
<div style="position: absolute; top: 0; left: 0; bottom: 0; width: 68%; border-radius: 14px; background: linear-gradient(90deg, #FFD37A, #FF8A3D 50%, #FF4D8D)"></div>
<span style="position: absolute; left: 14px; top: 9px; font-size: 20px; font-weight: 500; color: #1E1B18">68<span style="font-size: 12px">%</span></span>
</div>
</div>

<div style="display: flex; gap: 12px; margin-top: auto">
<button style="flex-grow: 1; height: 56px; border: 1px solid {{t.line}}; border-radius: 28px; background: transparent; color: {{t.ink}}; font: 600 16px 'Be Vietnam Pro', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="{{t.ink}}" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
Tạm dừng
</button>
<button style="flex-grow: 1; height: 56px; border: 0; border-radius: 28px; background: {{t.stopBg}}; color: {{t.stopInk}}; font: 600 16px 'Be Vietnam Pro', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="#FF4D8D"></rect></svg>
Kết thúc
</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = (this.props.theme ?? 'light') === 'dark';
const t = dark
? {
card: '#1E1F23', ink: '#F4F1EC', muted: '#B3AEA6', line: '#44464C', track: '#2E3036',
stopBg: '#F4F1EC', stopInk: '#1E1B18',
sky: 'linear-gradient(170deg, #241B5E 0%, #6A2BD9 32%, #E0337A 64%, #FF7A1A 100%)'
}
: {
card: '#F6F1EA', ink: '#1E1B18', muted: '#6B625A', line: '#D9CEC1', track: '#EAE1D6',
stopBg: '#1E1B18', stopInk: '#FFFDF9',
sky: 'linear-gradient(170deg, #7B61FF 0%, #C04DD8 30%, #FF4D8D 58%, #FF8A1F 84%, #FFC23D 100%)'
};
return { t };
}
}
</script>
</body>
</html>
